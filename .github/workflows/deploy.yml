name: Deploy WSG site to Firebase Hosting

# Every push to main deploys the marketing site to Firebase Hosting
# (project: western-studio -> westernstudio.co.uk).
#
# Auth: a Firebase CI token stored as the FIREBASE_TOKEN repo secret
# (from `firebase login:ci`). This is a user token, not a service-account
# key, so it works even though the org blocks service-account key creation.
# The site is static (no build step) - firebase deploy uploads WesternStudio/public.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g firebase-tools@13
      - name: Deploy to Firebase Hosting
        working-directory: WesternStudio
        run: firebase deploy --only hosting --project western-studio --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
