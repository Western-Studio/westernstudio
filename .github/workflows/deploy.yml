name: Deploy to Firebase Hosting

# Every push to main publishes the site to Firebase Hosting (live channel),
# which serves western-studio.web.app and the custom domain westernstudio.co.uk.
# The site is plain static files (WesternStudio/public), so there is no build step.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: western-studio
          entryPoint: WesternStudio   # folder that contains firebase.json
