<style>
  :root{color-scheme:light dark;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:#EFEEE7;color:#191F1A;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  @media (prefers-color-scheme:dark){body{background:#10130D;color:#EEEDE3;}}
  .lock{width:100%;max-width:380px;text-align:center;}
  .mark{font-weight:800;letter-spacing:.02em;font-size:15px;text-transform:uppercase;opacity:.72;}
  h1{font-size:22px;margin:14px 0 6px;letter-spacing:-.01em;}

  form{display:flex;flex-direction:column;gap:10px;}
  input{font:inherit;font-size:15px;padding:13px 15px;border-radius:11px;border:1px solid #CFCCC2;
    background:#fff;color:inherit;text-align:center;letter-spacing:.04em;}
  @media (prefers-color-scheme:dark){input{background:#1A1E16;border-color:#2B3127;}}
  input:focus-visible{outline:2px solid #8A6716;outline-offset:1px;}
  button{font:inherit;font-weight:700;font-size:15px;padding:13px 15px;border-radius:11px;border:none;
    background:#191F1A;color:#EFEEE7;cursor:pointer;transition:opacity .15s;}
  @media (prefers-color-scheme:dark){button{background:#D9B45C;color:#161206;}}
  button:hover{opacity:.9;} button:disabled{opacity:.55;cursor:progress;}
  .err{min-height:18px;font-size:13px;color:#A2492F;margin-top:2px;}
  @media (prefers-color-scheme:dark){.err{color:#E0906F;}}
  .foot{margin-top:24px;font-size:11.5px;opacity:.5;line-height:1.5;}
</style>
